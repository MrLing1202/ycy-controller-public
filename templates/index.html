<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>YCY 音频强度控制器</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>YCY 音频强度控制器</h1>
      <p>Web Bluetooth + 视频/屏幕声音实时映射</p>
    </div>
    <div class="status-pill" id="bleStatus"><span class="dot off"></span><span>未连接</span></div>
  </header>

  <main class="layout">
    <section class="card hero-card">
      <div class="card-title">
        <h2>1. 蓝牙连接</h2>
        <span class="mini">沿用原协议：FF40 / FF41 / FF42</span>
      </div>
      <div class="row wrap">
        <button id="btnConnect" class="primary">连接 BLE 设备</button>
        <button id="btnDisconnect">断开</button>
        <button id="btnStop" class="danger">紧急停止</button>
        <label class="check"><input id="demoMode" type="checkbox" checked /> 无设备时模拟</label>
      </div>
      <div class="config-grid">
        <label>设备名过滤<input id="deviceName" placeholder="YCY-FJB-03" /></label>
        <label>Service UUID<input id="serviceUuid" /></label>
        <label>Write UUID<input id="writeUuid" /></label>
        <label>Notify UUID<input id="notifyUuid" /></label>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <h2>2. 手动控制</h2>
        <span class="mini">A 0-40，B/C 0-20</span>
      </div>
      <div class="sliders">
        <div class="slider-line"><label>A</label><input id="manualA" type="range" min="0" max="40" value="0" /><output id="manualAOut">0</output></div>
        <div class="slider-line"><label>B</label><input id="manualB" type="range" min="0" max="20" value="0" /><output id="manualBOut">0</output></div>
        <div class="slider-line"><label>C</label><input id="manualC" type="range" min="0" max="20" value="0" /><output id="manualCOut">0</output></div>
      </div>
      <div class="row wrap">
        <button id="btnSendManual">发送手动速度</button>
        <button class="soft-stop" data-ch="A">停 A</button>
        <button class="soft-stop" data-ch="B">停 B</button>
        <button class="soft-stop" data-ch="C">停 C</button>
      </div>
      <div class="mode-grid">
        <label>A 模式<select id="modeA"></select></label>
        <label>B 模式<select id="modeB"></select></label>
        <label>C 模式<select id="modeC"></select></label>
      </div>
    </section>

    <section class="card audio-card">
      <div class="card-title">
        <h2>3. 视频/声音跟随强度</h2>
        <span class="mini">声音越强，输出越强。静音自动归零。</span>
      </div>

      <div class="tabs">
        <button class="tab active" data-audio-tab="file">本地视频/音频</button>
        <button class="tab" data-audio-tab="screen">屏幕/标签页声音</button>
      </div>

      <div id="tabFile" class="tab-panel active">
        <input id="mediaFile" type="file" accept="video/*,audio/*" />
        <video id="mediaPlayer" controls playsinline crossorigin="anonymous"></video>
      </div>

      <div id="tabScreen" class="tab-panel">
        <p class="hint">点“捕获屏幕声音”后，选择 Chrome/Edge 标签页或窗口，并勾选共享音频。</p>
        <button id="btnCaptureAudio">捕获屏幕声音</button>
        <video id="screenPreview" autoplay muted playsinline></video>
      </div>

      <div class="meter-wrap">
        <div class="meter"><div id="meterFill"></div></div>
        <div class="readout">
          <span>响度 <b id="rmsText">0.00</b></span>
          <span>强度 <b id="intensityText">0%</b></span>
          <span>输出 <b id="speedText">A0 B0 C0</b></span>
        </div>
      </div>

      <div class="row wrap">
        <button id="btnStartAudio" class="primary">启动音频跟随</button>
        <button id="btnStopAudio">停止音频跟随</button>
        <button id="btnCalibrate">校准当前音量为安静</button>
      </div>
    </section>

    <section class="card settings-card">
      <div class="card-title">
        <h2>4. 映射参数</h2>
        <span class="mini">先小范围测试，再逐步调大</span>
      </div>

      <div class="settings-grid">
        <label>静音阈值<input id="noiseFloor" type="range" min="0" max="0.08" step="0.0005" value="0.006" /><output id="noiseFloorOut">0.006</output></label>
        <label>增益<input id="gain" type="range" min="0.5" max="30" step="0.1" value="6.0" /><output id="gainOut">6.0</output></label>
        <label>弱声增强<input id="lowBoost" type="range" min="0.20" max="1" step="0.05" value="0.45" /><output id="lowBoostOut">0.45</output></label>
        <label>最低强度<input id="minIntensity" type="range" min="0" max="0.40" step="0.01" value="0.06" /><output id="minIntensityOut">0.06</output></label>
        <label>冲击响应<input id="attack" type="range" min="0.05" max="1" step="0.01" value="0.45" /><output id="attackOut">0.45</output></label>
        <label>回落速度<input id="release" type="range" min="0.01" max="0.8" step="0.01" value="0.12" /><output id="releaseOut">0.12</output></label>
        <label>发送频率 Hz<input id="writeHz" type="range" min="1" max="12" step="1" value="6" /><output id="writeHzOut">6</output></label>
        <label>静音归零秒<input id="silentStop" type="range" min="0.3" max="5" step="0.1" value="1.2" /><output id="silentStopOut">1.2</output></label>
      </div>

      <h3>输出通道与上限</h3>
      <div class="channel-grid">
        <label><input id="enableA" type="checkbox" checked /> 启用 A</label>
        <label>A 上限<input id="maxA" type="range" min="0" max="40" value="18" /><output id="maxAOut">18</output></label>
        <label>A 权重<input id="weightA" type="range" min="0" max="1" step="0.05" value="0.7" /><output id="weightAOut">0.70</output></label>
        <label><input id="enableB" type="checkbox" /> 启用 B</label>
        <label>B 上限<input id="maxB" type="range" min="0" max="20" value="8" /><output id="maxBOut">8</output></label>
        <label>B 权重<input id="weightB" type="range" min="0" max="1" step="0.05" value="0.35" /><output id="weightBOut">0.35</output></label>
        <label><input id="enableC" type="checkbox" checked /> 启用 C</label>
        <label>C 上限<input id="maxC" type="range" min="0" max="20" value="12" /><output id="maxCOut">12</output></label>
        <label>C 权重<input id="weightC" type="range" min="0" max="1" step="0.05" value="1.0" /><output id="weightCOut">1.00</output></label>
      </div>
    </section>

    <section class="card log-card">
      <div class="card-title">
        <h2>运行日志</h2>
        <button id="btnClearLog">清空</button>
      </div>
      <pre id="log"></pre>
    </section>
  </main>
</body>
</html>
